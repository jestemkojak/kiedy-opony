<!doctype html>
<html lang="pl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiedy Opony — Czy już pora zmienić opony?</title>
    <meta
      name="description"
      content="Panel analityczny do oceny momentu wymiany opon na zimowe lub letnie na podstawie historii temperatur, lokalnej prognozy pogody, pory jazdy oraz zaleceń ekspertów PZPO i ADAC."
    />
    <meta property="og:title" content="Kiedy Opony — Czy już pora zmienić opony?" />
    <meta
      property="og:description"
      content="Sprawdź rekomendację wymiany opon dla swojej lokalizacji z analizą 7 dni wstecz, prognozy 7-dniowej, przymrozków, opadów oraz porównaniem drogi hamowania."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('oponaradar_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-sky-600/20 selection:text-sky-900 dark:selection:bg-sky-400/25 dark:selection:text-sky-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
